[project]
name = "auto-excal"
version = "1.3.0"
description = "A PyQt5 desktop tool for importing Excel score sheets and batch-filling web forms with DrissionPage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "drissionpage>=4.1.0.15",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "psutil>=7.0.0",
    "pyqt-siliconui",
    "pyqt5>=5.15.11",
    "pytz>=2025.1",
    "requests>=2.31.0",
]

[dependency-groups]
build = [
    "cx-Freeze>=7.2.7",
]

[tool.uv]
constraint-dependencies = ["pyqt5-qt5 <=5.15.2"]

[tool.uv.sources]
pyqt-siliconui = { git = "https://github.com/ChinaIceF/PyQt-SiliconUI.git" }

[[tool.cxfreeze.executables]]
script = "main.py"
base = "gui"
target_name = "AutoExcal"
icon = "pic/res/logo.ico"

[tool.cxfreeze.build_exe]
build_exe = "build/AutoExcal"
packages = [
    "PyQt5.QtCore",
    "PyQt5.QtGui",
    "PyQt5.QtWidgets",
    "PyQt5.QtNetwork",
    "siui",
    "parts",
    "config",
    "openpyxl",
    "DrissionPage",
    "psutil",
    "pic",
]
include_files = [
    "config",
    "pic",
    "version.json",
    "license",
]
excludes = [
    "matplotlib",
    "backports",
    "PIL",
    "lib2to3",
    "setuptools",
    "tkinter",
    "unittest",
    "email",
    "cryptography",
    "pydoc",
]
optimize = 2
include_msvcr = true

